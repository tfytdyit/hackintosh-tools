<html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;line-height:1.6;color:#222;margin:14px 18px}
h2{font-size:15px;margin:0 0 8px}
li{margin:3px 0}
.note{color:#8a5a00;background:#fff6e0;padding:8px 10px;border-radius:6px;margin-top:10px}
</style></head><body>
<h2>@TITLE@</h2>
<p>这个安装包会把这个 App 装进 <b>/Applications</b>。</p>
<h3>@APP@ @VER@</h3>
<p>@DESC@</p>
<div class="note">安装需要输入一次管理员密码。这是本地自签名（ad-hoc）的包，系统可能提示「无法验证开发者」——右键安装包 →「打开」即可继续。</div>
</body></html>
