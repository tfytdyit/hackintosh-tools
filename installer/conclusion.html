<h2>安装完成</h2>
<ul>
<li><b>SensorBar</b>：菜单栏出现温度数字，点开是面板。首次使用心率时系统会询问蓝牙权限，选「允许」。开机自启在面板底部或设置里勾选。</li>
<li><b>VideoBar</b>：把视频文件或文件夹拖进窗口即可；也可以右键视频 →「打开方式」。想设为默认播放器：显示简介 → 打开方式 → 全部更改。</li>
<li><b>BacklightBar</b>：菜单栏出现 ☀ 图标；Fn+F5 调暗、Fn+F6 调亮（长按连续调整）。觉得图标碍眼可以在菜单里隐藏，之后用 <code>open -a BacklightBar</code> 再打开。</li>
</ul>
<p>三个 App 都是本地自签名，首次打开若被系统拦，右键 →「打开」一次即可。</p>
</body></html>
